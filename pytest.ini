[pytest]
asyncio_mode = auto
pythonpath = .
python_files = test*.py *_test.py

# Run subsets:
#   all build tests:          pytest build/tests/
#   data pipeline only:       pytest build/tests/data/
#   future train tests:       pytest build/tests/train/
#   future eval tests:        pytest build/tests/eval/
#   by marker:                pytest -m data

markers =
    data: data pipeline components
    train: training pipeline components
    eval: evaluation pipeline components
    integration: end-to-end tests that call real external services (requires OPENAI_API_KEY)

# Run integration tests: pytest build/tests/data/integration_tests/ -m integration
